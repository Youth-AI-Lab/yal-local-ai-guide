<title id="t">One layer of the model, opened</title>
<desc id="d">An assembly line. The numbers of each token enter a layer. First station: look back at earlier tokens, also called attention, in 28 ways at once. Second station: the token's own calculation. The changed numbers go on to the next layer. Below, 28 numbered slots, each with two stations of the same kind and its own parameters.</desc>

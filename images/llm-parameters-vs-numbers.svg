<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 446" width="900" height="446" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Parameters against a token's numbers</title>
<desc id="d">In the middle, one panel of fixed knobs: the 7.6 billion parameters, the same for all texts. Two texts, "How do I put out a campfire?" and "The capital of France is", pass through it. Each token has 3,584 numbers, which start from the table of parameters and are changed for that text. They give the probabilities and are not kept in the model. The knobs do not move when the model answers.</desc>

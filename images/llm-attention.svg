<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 376" width="900" height="376" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">Attention: a token looks only at the tokens before it</title>
<desc id="d">The sentence cut into tokens, with 'out' highlighted. Curved arrows go from it back to the 4 tokens of the question before it. The later tokens are greyed out; one dashed arrow towards a later token is crossed out, because a token cannot look ahead. Illustration, not a measure: the hidden tokens before the question count too, and some tokens get more weight than others.</desc>
<defs>
<marker id="arrow-c8602a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8602a"/></marker>
</defs>

<text x="404.74" y="44" font-size="16" fill="#1f2a37" text-anchor="end"><tspan font-weight="bold">Looks back</tspan> at every earlier token</text>
<path d="M450.05 234C440.05 9.8 203.4 9.8 193.4 233" fill="none" stroke="#c8602a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-c8602a)"/>

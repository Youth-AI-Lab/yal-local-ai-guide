<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 882" width="420" height="882" role="img" aria-labelledby="t d" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<title id="t">The whole chain, from question to next token</title>
<desc id="d">The question "How do I put out a campfire?" and the hidden text around it are cut into 38 tokens, 9 for the question and 29 hidden. Each token becomes 3,584 numbers. 28 layers in a row change these numbers. The last stage gives a probability to each of the 152,064 tokens: To 64.0%, Putting 35.6%. The draw picks one, here the top token "To". An arrow adds "To" to the text and repeats for each token of the answer: only the new token goes through. Inside the model, 7.6 billion parameters, fixed, the file on disk, feed the numbers, the layers and the last stage.</desc>

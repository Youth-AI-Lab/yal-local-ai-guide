<title id="t">The next token: probabilities and lottery tickets</title>
<desc id="d">After "To put out a campfire, pour", the model gives water 82.2%, then a 3.1%, (a space) 2.4%, soil 2.4%, sand 1.6%, cold 1.3%, and 7.0% for all the other tokens. The same shares as 100 lottery tickets: 82 for water, 11 for the next five tokens, 7 for all the others. Ollama draws one ticket.</desc>
